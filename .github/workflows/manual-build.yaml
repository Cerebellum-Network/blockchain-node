name: "Manual Build"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag (e.g., dev, v8.0.0-rc1, feature-xyz)'
        required: true
        type: string
        default: 'manual'

      platforms:
        description: 'Build platforms'
        required: true
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64
        default: 'linux/amd64'

env:
  PROFILE: release
  DOCKERHUB_REPOSITORY: cerebellumnetwork
  PACKAGE_NAME: pos-node
  # GH_READ_TOKEN reaches git through its environment form, never the global config, so nothing
  # persists on a self-hosted runner. "Configure git authentication header" sets GIT_CONFIG_COUNT
  # and adds the extraheader as entry 1.
  GIT_CONFIG_KEY_0: url.https://${{ secrets.GH_READ_TOKEN }}:x-oauth-basic@github.com/.insteadOf
  GIT_CONFIG_VALUE_0: https://github.com/

permissions:
  id-token: write
  contents: read

jobs:
  prepare:
    name: "Prepare build matrix"
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.set.outputs.platforms }}
    steps:
      - id: set
        run: |
          if [[ "${{ inputs.platforms }}" == "linux/amd64,linux/arm64" ]]; then
            echo 'platforms=["linux/amd64","linux/arm64"]' >> $GITHUB_OUTPUT
          else
            echo 'platforms=["linux/amd64"]' >> $GITHUB_OUTPUT
          fi

  build:
    name: "Build (${{ matrix.platform }})"
    needs: prepare
    runs-on: cere-network-large-disk
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    steps:
      - name: "Reclaim disk on self-hosted runner"
        run: |
          set -x
          df -h /
          # Print a full breakdown so future failures show exactly
          # where disk is going.
          docker system df || true
          docker volume ls --filter 'name=buildx_buildkit_' || true

          # Drop stopped containers, then every image no container uses. -a also
          # takes tagged images (past pos-node builds), which plain prune keeps.
          docker container prune --force || true
          echo "image prune: $(docker image prune -a --force 2>&1 | tail -n 1)" || true

          # Buildkit state volumes from prior `Set up Docker Buildx`
          # runs accumulate when builders aren't cleanly removed
          # (post-step skipped on cancelled jobs, etc.). Drop the ones
          # not currently in use.
          docker volume ls --filter 'name=buildx_buildkit_' --filter 'dangling=true' -q \
            | xargs -r docker volume rm || true

          # Across-the-board buildx cache cap (covers any builder still
          # referenced by another running job).
          for b in $(docker buildx ls --format '{{.Name}}' 2>/dev/null | tail -n +2 | awk '{print $1}'); do
            docker buildx prune --builder "$b" --keep-storage 30g --force || true
          done

          df -h /
          docker system df || true

      - name: "Remove git credentials from the runner's global config"
        # Earlier runs left a GH_READ_TOKEN insteadOf rewrite and an auth extraheader in this
        # runner's global gitconfig, which makes checkout fail with HTTP 400. Matched by key
        # pattern; nothing is printed.
        run: |
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          keys="$(git config --global --get-regexp '^url\..*\.insteadof$' '^https://github\.com/$' 2>/dev/null | cut -d' ' -f1)" || true
          for key in $keys; do
            git config --global --unset-all "$key" 2>/dev/null || true
          done

      - name: "Checkout code"
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: "Configure git authentication header"
        run: |
          header_b64="$(printf 'x-access-token:%s' '${{ secrets.GH_READ_TOKEN }}' | base64 | tr -d '\n')"
          echo "::add-mask::${header_b64}"
          {
            echo "GIT_CONFIG_COUNT=2"
            echo "GIT_CONFIG_KEY_1=http.https://github.com/.extraheader"
            echo "GIT_CONFIG_VALUE_1=AUTHORIZATION: basic ${header_b64}"
          } >> "$GITHUB_ENV"

      - name: "Cache cargo registry"
        uses: actions/cache@v4
        continue-on-error: false
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.platform }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.platform }}-
            ${{ runner.os }}-cargo-

      - name: "Set up QEMU"
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v3

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Install toolchain and rust-src"
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.91.0
          target: wasm32-unknown-unknown
          components: rust-src
          cache: false
          rustflags: ""

      - name: "Login to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Compute platform slug"
        id: slug
        run: echo "slug=$(echo ${{ matrix.platform }} | tr '/' '-')" >> $GITHUB_OUTPUT

      - name: "Build and push per-platform image"
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          provenance: false
          build-args: |
            GH_READ_TOKEN=${{ secrets.GH_READ_TOKEN }}
          tags: |
            ${{ env.DOCKERHUB_REPOSITORY }}/${{ env.PACKAGE_NAME }}:${{ inputs.version }}-${{ steps.slug.outputs.slug }}

  manifest:
    name: "Create multi-arch manifest"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: "Login to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Configure short SHA"
        run: echo "GITHUB_SHA_SHORT=${GITHUB_SHA:0:7}" >> ${GITHUB_ENV}

      - name: "Create and push manifest"
        run: |
          set -euo pipefail
          IMAGES=""
          if [[ "${{ inputs.platforms }}" == *"linux/amd64"* ]]; then
            IMAGES="$IMAGES ${{ env.DOCKERHUB_REPOSITORY }}/${{ env.PACKAGE_NAME }}:${{ inputs.version }}-linux-amd64"
          fi
          if [[ "${{ inputs.platforms }}" == *"linux/arm64"* ]]; then
            IMAGES="$IMAGES ${{ env.DOCKERHUB_REPOSITORY }}/${{ env.PACKAGE_NAME }}:${{ inputs.version }}-linux-arm64"
          fi

          docker buildx imagetools create \
            -t ${{ env.DOCKERHUB_REPOSITORY }}/${{ env.PACKAGE_NAME }}:${{ inputs.version }} \
            -t ${{ env.DOCKERHUB_REPOSITORY }}/${{ env.PACKAGE_NAME }}:${{ env.GITHUB_SHA_SHORT }} \
            $IMAGES

      - name: "Summary"
        run: |
          echo "✅ Blockchain Node built and tagged successfully!"
          echo ""
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "🏷️  Version: ${{ inputs.version }}"
          echo "🔧 Platforms: ${{ inputs.platforms }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo ""
          echo "🐳 Docker images (multi-arch manifest):"
          echo "  - ${{ env.DOCKERHUB_REPOSITORY }}/${{ env.PACKAGE_NAME }}:${{ inputs.version }}"
          echo "  - ${{ env.DOCKERHUB_REPOSITORY }}/${{ env.PACKAGE_NAME }}:${{ env.GITHUB_SHA_SHORT }}"
