name: Republish dev-latest docker image to DockerHub
on:
  workflow_dispatch:

env:
  ECR_REPOSITORY: pos-network-node
  DOCKERHUB_REPOSITORY: cerebellumnetwork
  PACKAGE_NAME: pos-node
  # GH_READ_TOKEN reaches git through its environment form, never the global config, so nothing
  # persists on a self-hosted runner. "Configure git authentication header" sets GIT_CONFIG_COUNT
  # and adds the extraheader as entry 1.
  GIT_CONFIG_KEY_0: url.https://${{ secrets.GH_READ_TOKEN }}:x-oauth-basic@github.com/.insteadOf
  GIT_CONFIG_VALUE_0: https://github.com/
jobs:
  tag-and-push:
    runs-on: [self-hosted, cere-network-xlarge]
    steps:
      - name: "Remove git credentials from the runner's global config"
        # Earlier runs left a GH_READ_TOKEN insteadOf rewrite and an auth extraheader in this
        # runner's global gitconfig, which makes checkout fail with HTTP 400. Matched by key
        # pattern; nothing is printed.
        run: |
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          keys="$(git config --global --get-regexp '^url\..*\.insteadof$' '^https://github\.com/$' 2>/dev/null | cut -d' ' -f1)" || true
          for key in $keys; do
            git config --global --unset-all "$key" 2>/dev/null || true
          done

      - name: "Configure git authentication header"
        run: |
          header_b64="$(printf 'x-access-token:%s' '${{ secrets.GH_READ_TOKEN }}' | base64 | tr -d '\n')"
          echo "::add-mask::${header_b64}"
          {
            echo "GIT_CONFIG_COUNT=2"
            echo "GIT_CONFIG_KEY_1=http.https://github.com/.extraheader"
            echo "GIT_CONFIG_VALUE_1=AUTHORIZATION: basic ${header_b64}"
          } >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.DEV_NETWORK_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEV_NETWORK_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Pull image from ECR and change name, push tagged version to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:dev-latest
          docker image tag $ECR_REGISTRY/$ECR_REPOSITORY:dev-latest $DOCKERHUB_REPOSITORY/$PACKAGE_NAME:dev-latest
      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish image to DockerHub
        id: docker_publish
        run: |
          docker push $DOCKERHUB_REPOSITORY/$PACKAGE_NAME:dev-latest
      - name: Image digest
        run: echo ${{ steps.docker_publish.outputs.digest }}
